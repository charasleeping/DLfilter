name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cargo build --release --locked
      - run: python -m pip install pyinstaller==6.16.0 certifi==2026.7.22
      - run: python -m PyInstaller --onefile --name dlfilter-titles --paths . scripts/title_helper.py
      - name: Smoke-test the private helper
        run: python scripts/smoke_helper.py
      - name: Package the native executable
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py --tag "$env:TAG"
        if: runner.os == 'Windows'
      - name: Package the native executable
        env:
          TAG: ${{ github.ref_name }}
        run: python scripts/package_release.py --tag "$TAG"
        if: runner.os != 'Windows'
      - name: Verify extracted release without system tools
        run: python scripts/smoke_release.py
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.sha256
          generate_release_notes: true
